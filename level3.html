<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kate's Corner – Level 3</title>
  <style>
    :root {
      --navy: #003b73; --page-bg: #f8fafc; --card-bg: #ffffff;
      --text: #24384d; --muted: #51606f; --border: #e8edf3;
      --choice-a: #2ecc71; --choice-b: #a8d94a; --choice-c: #f5a623; --choice-d: #ef4444; --neutral: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: var(--page-bg); color: var(--text); }
    .page { min-height: 100vh; padding: 41px 44px; position: relative; }
    .header { display: flex; align-items: center; gap: 20px; }
    .logo { width: 56px; height: 56px; border-radius: 6px; background: var(--navy); color: white; display: grid; place-items: center; font-weight: 700; letter-spacing: 0.5px; box-shadow: 0 8px 15px rgba(0,59,115,0.22); text-decoration: none; }
    .title { margin: 0; color: var(--navy); font-size: 28px; line-height: 1; font-weight: 800; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 15px; }
    .form-wrap { width: min(600px, calc(100vw - 32px)); margin: 50px auto 0; display: flex; flex-direction: column; gap: 20px; }
    .card { min-height: 90px; border-radius: 34px; background: var(--card-bg); border: 1px solid var(--border); box-shadow: 0 18px 35px rgba(15,23,42,0.08); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px; padding: 20px 28px 20px 44px; position: relative; overflow: hidden; transition: 0.25s ease; }
    .card::before { content: ""; position: absolute; left: 0; top: 0; width: 14px; height: 100%; background: var(--neutral); transition: background 0.25s ease; }
    .card.sel-a::before { background: var(--choice-a); } .card.sel-b::before { background: var(--choice-b); } .card.sel-c::before { background: var(--choice-c); } .card.sel-d::before { background: var(--choice-d); }
    .card.sel-a { box-shadow: 0 18px 35px rgba(46,204,113,0.16); } .card.sel-b { box-shadow: 0 18px 35px rgba(168,217,74,0.20); } .card.sel-c { box-shadow: 0 18px 35px rgba(245,166,35,0.18); } .card.sel-d { box-shadow: 0 18px 35px rgba(239,68,68,0.18); }
    .card-title { font-size: 16px; color: #9aa5b1; letter-spacing: 0.2px; flex: 1 1 auto; }
    .level-select { flex: 0 0 auto; border: 1px solid #b9b9b9; border-radius: 6px; background: linear-gradient(#f4f4f4,#dcdcdc); color: #202124; font-size: 14px; font-weight: 700; padding: 8px 10px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.18); }
    .level-select:hover { background: linear-gradient(#ffffff,#e8e8e8); }
    .level-select.sel-a { color: #1a7a40; } .level-select.sel-b { color: #5a7a00; } .level-select.sel-c { color: #b87900; } .level-select.sel-d { color: #c62828; }
    option[value="choice-a"] { color: #1a7a40; font-weight: bold; } option[value="choice-b"] { color: #5a7a00; font-weight: bold; } option[value="choice-c"] { color: #b87900; font-weight: bold; } option[value="choice-d"] { color: #c62828; font-weight: bold; }
    .noise-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px; padding: 18px 28px; box-shadow: 0 8px 20px rgba(15,23,42,0.06); display: flex; flex-direction: column; gap: 12px; }
    .noise-label { font-size: 14px; font-weight: 700; color: var(--navy); }
    .noise-label span { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 6px; }
    .noise-options { display: flex; gap: 10px; }
    .noise-btn { flex: 1; padding: 10px; border-radius: 12px; cursor: pointer; font-size: 14px; font-weight: 700; border: 2px solid var(--border); background: var(--card-bg); color: var(--muted); transition: 0.2s ease; }
    .noise-btn:hover { border-color: #94a3b8; color: var(--text); }
    .noise-btn.active-quiet { border-color: #22c55e; background: #f0fdf4; color: #15803d; }
    .noise-btn.active-noisy { border-color: #f59e0b; background: #fffbeb; color: #b45309; }
    .submit-btn { width: 100%; padding: 14px; background: var(--navy); color: white; border: none; border-radius: 16px; font-size: 15px; font-weight: 700; cursor: pointer; box-shadow: 0 8px 20px rgba(0,59,115,0.2); transition: 0.2s ease; }
    .submit-btn:hover { background: #00509e; transform: translateY(-1px); }
    .submit-btn:disabled { background: #94a3b8; cursor: not-allowed; transform: none; }
    .feedback-msg { text-align: center; font-size: 14px; font-weight: 600; color: #15803d; display: none; padding: 8px; }
    .back-link { display: inline-block; margin-top: 24px; color: var(--navy); font-size: 14px; text-decoration: none; opacity: 0.7; }
    .back-link:hover { opacity: 1; }
    .disclaimer { margin-top: 24px; color: #536476; font-size: 13px; }
    @media (max-width: 500px) { .page { padding: 28px 16px; } .form-wrap { margin-top: 40px; } .card { padding: 20px 20px 20px 36px; border-radius: 24px; } .level-select { width: 100%; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="header">
      <a class="logo" href="index.html" aria-label="Back to all levels">KC</a>
      <div>
        <h1 class="title">Kate's Corner</h1>
        <p class="subtitle">A quick peek at how busy Kate Edger's study rooms are</p>
      </div>
    </header>

    <div class="form-wrap">
      <div class="card" id="statusCard">
        <span class="card-title">Level 3 – Quiet Study Space</span>
        <select class="level-select" id="availSelect" aria-label="Level 3 – Quiet Study Space availability">
          <option value="">How busy is it?</option>
          <option value="choice-a">Empty – Very easy to find seats</option>
          <option value="choice-b">Moderate – Quite easy to find seats</option>
          <option value="choice-c">Limited – Might be difficult to find seats</option>
          <option value="choice-d">Full – Basically no seats left</option>
        </select>
      </div>

      <!-- Noise level -->
      <div class="noise-card">
        <div class="noise-label">How's the noise level? <span>optional</span></div>
        <div class="noise-options">
          <button class="noise-btn" id="btnQuiet" type="button">🔇 Quiet</button>
          <button class="noise-btn" id="btnNoisy" type="button">🔊 Noisy</button>
        </div>
      </div>
      <button class="submit-btn" id="submitBtn" disabled>Submit</button>
      <div class="feedback-msg" id="feedbackMsg">✓ Thanks for helping your fellow students!</div>
      <a class="back-link" href="index.html">← Back to all levels</a>
      <p class="disclaimer">Status updates are approximate.</p>
    </div>
  </main>

  <script>
    var noiseValue = null;

    // Noise toggles (only present on level 3 and 4)
    var btnQuiet = document.getElementById('btnQuiet');
    var btnNoisy = document.getElementById('btnNoisy');
    if (btnQuiet) {
      btnQuiet.addEventListener('click', function() {
        noiseValue = noiseValue === 'quiet' ? null : 'quiet';
        btnQuiet.className = 'noise-btn' + (noiseValue === 'quiet' ? ' active-quiet' : '');
        btnNoisy.className = 'noise-btn';
      });
      btnNoisy.addEventListener('click', function() {
        noiseValue = noiseValue === 'noisy' ? null : 'noisy';
        btnNoisy.className = 'noise-btn' + (noiseValue === 'noisy' ? ' active-noisy' : '');
        btnQuiet.className = 'noise-btn';
      });
    }

    // Availability dropdown colour
    var availSelect = document.getElementById('availSelect');
    var statusCard  = document.getElementById('statusCard');
    var submitBtn   = document.getElementById('submitBtn');
    var colourMap   = { 'choice-a':'sel-a', 'choice-b':'sel-b', 'choice-c':'sel-c', 'choice-d':'sel-d' };

    availSelect.addEventListener('change', function() {
      Object.values(colourMap).forEach(function(c){ availSelect.classList.remove(c); statusCard.classList.remove(c); });
      var cls = colourMap[availSelect.value];
      if (cls) { availSelect.classList.add(cls); statusCard.classList.add(cls); }
      submitBtn.disabled = !availSelect.value;
    });

    // ── Contribution streak + counter ──
    function trackContribution() {
      var today     = new Date().toDateString();
      var lastDate  = localStorage.getItem('kc_last_submit_date');
      var streak    = parseInt(localStorage.getItem('kc_streak') || '0');
      var total     = parseInt(localStorage.getItem('kc_total')  || '0');
      var yesterday = new Date(); yesterday.setDate(yesterday.getDate() - 1);

      var newStreak;
      if (lastDate === today) {
        newStreak = streak;                            // already submitted today
      } else if (lastDate === yesterday.toDateString()) {
        newStreak = streak + 1;                        // consecutive day
      } else {
        newStreak = 1;                                 // gap — reset
      }

      localStorage.setItem('kc_last_submit_date', today);
      localStorage.setItem('kc_streak', newStreak);
      localStorage.setItem('kc_total',  total + 1);
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, push } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyA9JJLRflZghT5y0To_lc384iOARQNnzfw",
      authDomain:        "kates-corner-d1d82.firebaseapp.com",
      databaseURL:       "https://kates-corner-d1d82-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:         "kates-corner-d1d82",
      storageBucket:     "kates-corner-d1d82.firebasestorage.app",
      messagingSenderId: "856271823905",
      appId:             "1:856271823905:web:71eeea2c855c954e91af60",
      measurementId:     "G-5SN58F3Z56"
    };

    const db = getDatabase(initializeApp(firebaseConfig));
    const ROOM_KEY = "level3";

    document.getElementById('submitBtn').addEventListener('click', async () => {
      const availValue = document.getElementById('availSelect').value;
      if (!availValue) return;

      const now = new Date().toISOString();
      const submitBtn   = document.getElementById('submitBtn');
      const feedbackMsg = document.getElementById('feedbackMsg');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting…';

      try {
        await push(ref(db, `kates-corner/history/${ROOM_KEY}`), { value: availValue, updatedAt: now });

        if (window.noiseValue) {
          await push(ref(db, `kates-corner/noise/${ROOM_KEY}`), { value: window.noiseValue, updatedAt: now });
        }

        // Record contribution in localStorage
        trackContribution();

        feedbackMsg.style.display = 'block';
        submitBtn.textContent = 'Submitted ✓';
        setTimeout(() => { window.location.href = 'index.html'; }, 1500);

      } catch (err) {
        console.error(err);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit';
        alert('Something went wrong — please try again.');
      }
    });
  </script>
</body>
</html>
