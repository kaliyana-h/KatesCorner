<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kate's Corner FINAL</title>
<style>
:root {--navy:#003b73;--page-bg:#f8fafc;--card-bg:#ffffff;--text:#24384d;--muted:#51606f;--border:#e8edf3;}
body{margin:0;font-family:Arial;background:var(--page-bg);} .page{padding:40px;}
.card{background:white;border:1px solid var(--border);padding:20px;border-radius:20px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.right{display:flex;flex-direction:column;align-items:flex-end;}
.last-updated-level{font-size:11px;color:var(--muted);margin-top:5px;}
#datetime-widget{position:fixed;top:20px;right:24px;background:white;border:1px solid var(--border);padding:10px;border-radius:10px;cursor:pointer;}
#datetime-widget span{font-size:12px;color:var(--muted);display:block;}
</style>
</head>
<body>
<div id="datetime-widget"></div>
<div class="page">
<h1>Kate's Corner FINAL</h1>
<div class="card"><span>Level 0</span><div class="right"><select><option value="">Choose...</option><option value="a">Not Busy</option><option value="b">Moderate</option><option value="c">Full</option></select><div class="last-updated-level"></div></div></div>
<div class="card"><span>Level 2</span><div class="right"><select><option value="">Choose...</option><option value="a">Not Busy</option><option value="b">Moderate</option><option value="c">Full</option></select><div class="last-updated-level"></div></div></div>
<div class="card"><span>Level 3</span><div class="right"><select><option value="">Choose...</option><option value="a">Not Busy</option><option value="b">Moderate</option><option value="c">Full</option></select><div class="last-updated-level"></div></div></div>
<div class="card"><span>Level 4</span><div class="right"><select><option value="">Choose...</option><option value="a">Not Busy</option><option value="b">Moderate</option><option value="c">Full</option></select><div class="last-updated-level"></div></div></div>
</div>
<script>
let use24=true;function clock(){let n=new Date();let d=n.toLocaleDateString();let t=n.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:!use24});document.getElementById("datetime-widget").innerHTML=`<b>${t}</b><span>${d}</span>`;}document.getElementById("datetime-widget").onclick=()=>{use24=!use24;clock();};clock();setInterval(clock,1000);
const DATA_KEY="kc_data";const TIME_KEY="kc_times";
function getData(){return JSON.parse(localStorage.getItem(DATA_KEY))||{};}function saveData(d){localStorage.setItem(DATA_KEY,JSON.stringify(d));}
function getTimes(){return JSON.parse(localStorage.getItem(TIME_KEY))||{};}function saveTimes(t){localStorage.setItem(TIME_KEY,JSON.stringify(t));}
function nowTime(){return new Date().toLocaleTimeString();}
let names=["Level 0","Level 2","Level 3","Level 4"];
document.querySelectorAll(".card").forEach((card,i)=>{let sel=card.querySelector("select");let display=card.querySelector(".last-updated-level");let name=names[i];let d=getData();let t=getTimes();if(d[name]) sel.value=d[name];if(t[name]) display.innerText="Last updated: "+t[name];sel.onchange=()=>{let d=getData();let t=getTimes();d[name]=sel.value;t[name]=nowTime();saveData(d);saveTimes(t);display.innerText="Last updated: "+t[name];};});
</script>
</body>
</html>
