<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Update Status – Kate's Corner</title>
  <style>
    #liveDateTime {
      position: fixed; top: 16px; right: 20px;
      font-size: 14px; font-weight: 600; color: #24384d;
      background: white; padding: 6px 12px;
      border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      z-index: 50;
    }

    :root {
      --navy: #003b73;
      --page-bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #24384d;
      --muted: #51606f;
      --border: #e8edf3;
      --choice-a: #2ecc71;
      --choice-b: #a8d94a;
      --choice-c: #f5a623;
      --choice-d: #ef4444;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: Arial, Helvetica, sans-serif; background: var(--page-bg); color: var(--text); }
    .page { min-height: 100vh; padding: 41px 44px; position: relative; }
    
    .header { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
    .logo {
      width: 56px; height: 56px; border-radius: 6px;
      background: var(--navy); color: white;
      display: grid; place-items: center;
      font-weight: 700; letter-spacing: 0.5px;
      box-shadow: 0 8px 15px rgba(0,59,115,0.22);
    }
    .title { margin: 0; color: var(--navy); font-size: 28px; line-height: 1; font-weight: 800; }
    .subtitle { margin: 8px 0 0; color: var(--muted); font-size: 15px; }

    /* Back Button Styling */
    .back-btn {
      display: inline-flex; align-items: center; gap: 8px;
      text-decoration: none; font-size: 14px; font-weight: 700; color: var(--navy);
      background: #eef4fb; padding: 10px 18px; border-radius: 999px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: all 0.2s ease;
      margin-bottom: 25px;
    }
    .back-btn:hover { background: #dcecff; transform: translateX(-2px); box-shadow: 0 6px 14px rgba(0,0,0,0.08); }
    .back-btn svg { fill: var(--navy); }

    /* Form Container Layout */
    .form-container { width: min(500px, calc(100vw - 32px)); margin: 20px auto 0; }
    
    .update-box {
      background: var(--card-bg); border: 1px solid var(--border); border-radius: 24px;
      padding: 30px; box-shadow: 0 18px 35px rgba(15,23,42,0.08);
    }
    .update-box h2 { margin: 0 0 8px 0; font-size: 20px; color: var(--navy); font-weight: 800; }
    .update-box p { margin: 0 0 24px 0; font-size: 14px; color: var(--muted); }

    /* Custom Radio Option Buttons */
    .radio-group { display: flex; flex-direction: column; gap: 12px; }
    .radio-label {
      display: flex; align-items: center; gap: 14px; padding: 16px 20px;
      border: 2px solid var(--border); border-radius: 16px; cursor: pointer;
      font-weight: 700; font-size: 15px; transition: all 0.2s ease; position: relative;
    }
    .radio-label input { position: absolute; opacity: 0; cursor: pointer; }
    
    /* Dynamic choice indicator rings */
    .custom-radio { width: 20px; height: 20px; border: 2px solid var(--border); border-radius: 50%; display: inline-block; transition: all 0.2s ease; }
    
    /* Specific row color highlights when selected */
    .radio-label:has(input[value="choice-a"]):hover, .radio-label:has(input[value="choice-a"]:checked) { border-color: var(--choice-a); background: #f0fdf4; }
    .radio-label:has(input[value="choice-b"]):hover, .radio-label:has(input[value="choice-b"]:checked) { border-color: var(--choice-b); background: #f0fce4; }
    .radio-label:has(input[value="choice-c"]):hover, .radio-label:has(input[value="choice-c"]:checked) { border-color: var(--choice-c); background: #fff7ed; }
    .radio-label:has(input[value="choice-d"]):hover, .radio-label:has(input[value="choice-d"]:checked) { border-color: var(--choice-d); background: #fef2f2; }

    .radio-label:has(input[value="choice-a"]:checked) .custom-radio { border-color: var(--choice-a); background: var(--choice-a); }
    .radio-label:has(input[value="choice-b"]:checked) .custom-radio { border-color: var(--choice-b); background: var(--choice-b); }
    .radio-label:has(input[value="choice-c"]:checked) .custom-radio { border-color: var(--choice-c); background: var(--choice-c); }
    .radio-label:has(input[value="choice-d"]:checked) .custom-radio { border-color: var(--choice-d); background: var(--choice-d); }

    /* Action buttons */
    .submit-btn {
      width: 100%; margin-top: 24px; padding: 14px; border: none;
      border-radius: 14px; background: var(--navy); color: white;
      font-size: 16px; font-weight: 700; cursor: pointer;
      box-shadow: 0 8px 15px rgba(0,59,115,0.2); transition: all 0.2s ease;
    }
    .submit-btn:hover { transform: translateY(-1px); box-shadow: 0 12px 20px rgba(0,59,115,0.3); opacity: 0.95; }
    .submit-btn:disabled { background: #cbd5e1; cursor: not-allowed; box-shadow: none; }

    #statusMessage { margin-top: 14px; font-size: 13px; font-weight: 600; text-align: center; display: none; }

    @media (max-width: 500px) {
      .page { padding: 28px 16px; }
      .update-box { padding: 20px; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div id="liveDateTime"></div>

  <main class="page">
    <a href="index.html" class="back-btn">
      <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z"/></svg>
      Back to Statuses
    </a>

    <header class="header">
      <div class="logo">KC</div>
      <div>
        <h1 class="title" id="pageTitle">Level Update</h1>
        <p class="subtitle">Crowdsourced busyness track tracker</p>
      </div>
    </header>

    <div class="form-container">
      <div class="update-box">
        <h2 id="boxHeading">How busy is this floor?</h2>
        <p>Select the option that matches the current environment to update your fellow students.</p>

        <form id="updateForm">
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="busyness" value="choice-a" required />
              <span class="custom-radio"></span> Empty (Plenty of seats available)
            </label>
            <label class="radio-label">
              <input type="radio" name="busyness" value="choice-b" />
              <span class="custom-radio"></span> Moderate (Some spaces open)
            </label>
            <label class="radio-label">
              <input type="radio" name="busyness" value="choice-c" />
              <span class="custom-radio"></span> Limited (Nearly filled up)
            </label>
            <label class="radio-label">
              <input type="radio" name="busyness" value="choice-d" />
              <span class="custom-radio"></span> Full (No seats left)
            </label>
          </div>

          <button type="submit" class="submit-btn" id="submitBtn">Submit Report</button>
          <div id="statusMessage"></div>
        </form>
      </div>
    </div>
  </main>

  <script>
    // Live Dynamic Header Clock
    function updateDateTime() {
      document.getElementById("liveDateTime").textContent =
        new Date().toLocaleDateString() + " | " +
        new Date().toLocaleTimeString([], { hour:'2-digit', minute:'2-digit', second:'2-digit' });
    }
    updateDateTime(); setInterval(updateDateTime, 1000);

    // Auto-detect which file this is to adjust headings automatically!
    const filename = window.location.pathname.split('/').pop() || "level0.html";
    const currentLevelKey = filename.replace('.html', ''); // e.g. "level0"
    const displayNames = {
      "level0": "Level 0 – Collaborative Study Space",
      "level2": "Level 2 – Collaborative Study Space",
      "level3": "Level 3 – Quiet Study Space",
      "level4": "Level 4 – Silent Study Space"
    };
    
    if (displayNames[currentLevelKey]) {
      document.getElementById("pageTitle").textContent = "Update " + currentLevelKey.replace('l', 'L');
      document.getElementById("boxHeading").textContent = displayNames[currentLevelKey];
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey:            "AIzaSyA9JJLRflZghT5y0To_lc384iOARQNnzfw",
      authDomain:        "kates-corner-d1d82.firebaseapp.com",
      databaseURL:       "https://kates-corner-d1d82-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId:         "kates-corner-d1d82",
      storageBucket:     "kates-corner-d1d82.firebasestorage.app",
      messagingSenderId: "856271823905",
      appId:             "1:856271823905:web:71eeea2c855c954e91af60",
      measurementId:     "G-5SN58F3Z56"
    };

    const db = getDatabase(initializeApp(firebaseConfig));
    const filename = window.location.pathname.split('/').pop() || "level0.html";
    const currentLevelKey = filename.replace('.html', ''); 

    const form = document.getElementById("updateForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMessage");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const selectedChoice = form.elements["busyness"].value;
      if (!selectedChoice) return;

      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting...";

      // Prepare payload structured cleanly for index.html data pipeline map readings
      const updates = {};
      updates[`kates-corner/levels/${currentLevelKey}`] = {
        value: selectedChoice,
        updatedAt: new Date().toISOString()
      };

      try {
        await update(ref(db), updates);
        
        statusMsg.style.color = "#16a34a";
        statusMsg.textContent = "Status updated successfully! Redirecting...";
        statusMsg.style.display = "block";

        // Bring students right back to your dashboard grid automatically after 1.5 seconds!
        setTimeout(() => {
          window.location.href = "index.html";
        }, 1500);

      } catch (error) {
        console.error("Firebase update failed:", error);
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "Error updating status. Please try again.";
        statusMsg.style.display = "block";
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Report";
      }
    });
  </script>
</body>
</html>
